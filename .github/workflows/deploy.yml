name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # "" on a custom domain, "/<repo>" on <user>.github.io/<repo>
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Google Sheets webhook. Set under Settings → Secrets and variables → Actions → Variables.
          VITE_QUOTE_WEBHOOK_URL: ${{ vars.QUOTE_WEBHOOK_URL }}

      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
